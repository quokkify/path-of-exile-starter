name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "java-kotlin"]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: quokkify/ci-kit/actions/checkout@v3.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"

  complete:
    name: CodeQL
    needs: analyze
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate analysis result
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          if [[ "$ANALYZE_RESULT" != "success" ]]; then
            echo "CodeQL analysis did not succeed: $ANALYZE_RESULT" >&2
            exit 1
          fi
