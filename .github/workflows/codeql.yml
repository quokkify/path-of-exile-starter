name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: quokkify/ci-kit/.github/workflows/codeql-analysis.yml@v4.1.0
    with:
      languages-override: '["actions", "java-kotlin"]'

  complete:
    name: CodeQL
    if: always()
    needs: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CodeQL analysis to pass
        env:
          ANALYZE_RESULT: ${{ needs.codeql.result }}
        run: test "$ANALYZE_RESULT" = success
