name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: quokkify/ci-kit/.github/workflows/release-please.yml@v3.1.1
    with:
      mode: single
      config-file: .github/release-please/config.json
      manifest-file: .github/release-please/manifest.json
      config-backed-single: true
      enrich-release-notes: true
      enrichment-script: .github/scripts/enrich_release_notes.py
