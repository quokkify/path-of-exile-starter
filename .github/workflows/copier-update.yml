name: Update project template

on:
  workflow_dispatch:
    inputs:
      template-ref:
        description: Optional ci-kit ref; empty uses the latest released tag.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: copier-template-update
  cancel-in-progress: false

jobs:
  update:
    name: Apply the shared project template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      push: ${{ steps.update.outputs.push }}
      ref: ${{ steps.update.outputs.ref }}
      base: ${{ steps.update.outputs.base }}
    steps:
      - name: Check out full repository history
        uses: quokkify/ci-kit/actions/checkout@v4.3.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python and Copier
        uses: quokkify/ci-kit/actions/setup-python@v4.3.7
        with:
          python-version: "3.14"
          package-manager: pip
          cache-dependencies: "false"
          install-command: python -m pip install copier==9.19.1

      - name: Apply the template
        id: update
        env:
          TEMPLATE_REF: ${{ inputs.template-ref }}
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/copier-template-update
        run: |
          set -euo pipefail
          ref="${TEMPLATE_REF:-}"
          if [[ -z "$ref" ]]; then
            ref="$(gh release view --repo quokkify/ci-kit --json tagName --jq .tagName)"
          fi

          # Manual refs are an explicit trust boundary: only published, stable,
          # exact release tags may select the template used with contents:write.
          if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Refused template ref %s: only exact SemVer release tags are allowed.\n' "$ref" >&2
            exit 1
          fi
          release_json="$(gh release view "$ref" --repo quokkify/ci-kit --json tagName,publishedAt,isDraft,isPrerelease)"
          if ! jq -e --arg expected "$ref" '
            .tagName == $expected and
            (.publishedAt | type == "string" and length > 0) and
            (.isDraft == false) and
            (.isPrerelease == false)
          ' <<<"$release_json" >/dev/null; then
            printf 'Refused template ref %s: it is not an exact published stable release tag.\n' "$ref" >&2
            exit 1
          fi
          echo "Updating to ci-kit $ref"

          git switch -C "$BRANCH"
          start="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ci-kit v4 has no legacy template. Legacy answers that hand every area off render
          # nothing: their deletion is a commit of its own, and the module update follows on the
          # same branch. Legacy answers that still render files are refused without changes
          # (CIK-CORE-030).
          dropped=false
          if [[ -f .copier-answers.yml ]]; then
            left="$(python - <<'PY'
          from pathlib import Path
          import yaml

          areas = ('validate', 'base', 'security', 'release', 'allure', 'renovate')
          try:
              answers = yaml.safe_load(Path('.copier-answers.yml').read_text())
          except (OSError, UnicodeDecodeError, yaml.YAMLError):
              answers = None
          handed = answers.get('handed_off') if isinstance(answers, dict) else None
          if not isinstance(handed, list) or not all(isinstance(area, str) for area in handed):
              handed = []
          print(', '.join(area for area in areas if area not in handed))
          PY
          )"
            if [[ -n "$left" ]]; then
              printf 'Refusing template update: CIK-CORE-030 legacy answers still render files; migrate with ci-kit v3.11.x (not handed off: %s). See https://github.com/quokkify/ci-kit/blob/main/docs/errors/CIK-CORE-030.md\n' "$left" >&2
              exit 1
            fi
            git rm -q .copier-answers.yml
            git commit -q -m "chore(ci-kit): drop empty legacy answers"
            dropped=true
          fi

          # A partial update is never pushed. Conflicts fail the run the same way the fleet
          # automation fails a repository, so the branch never holds a half-applied template
          # that a reviewer could mistake for a clean one.
          mapfile -t rejected < <(find . -name '*.rej' -not -path './.git/*' -print)
          if (( ${#rejected[@]} )); then
            printf 'Copier produced conflict files:\n' >&2
            printf '  %s\n' "${rejected[@]}" >&2
            exit 1
          fi

          # ci-kit update commits every module it updates; the commits are squashed
          # back into the single update commit below.
          base="$(git rev-parse HEAD)"
          python -m pip install "git+https://github.com/quokkify/ci-kit@${ref}"
          ci-kit update --repo . --to "$ref"
          git reset --soft "$base"

          # Copier deliberately preserves files with local edits, even when the
          # answers already name this ref. Verify the executable release helper
          # against the selected template revision on every run, including a
          # same-ref update. Do not overwrite a consumer customization here.
          helper=".github/scripts/enrich_release_notes.py"
          release=false
          if [[ -f .copier-answers.release.yml ]]; then
            release=true
          fi
          if [[ "$release" == "true" && ! -f "$helper" ]]; then
            printf 'Refusing template update: %s is missing while the release module is installed. Restore the helper, then rerun.\n' "$helper" >&2
            exit 1
          fi
          if [[ -f "$helper" ]]; then
            template_helper="$(mktemp)"
            trap 'rm -f "$template_helper"' EXIT
            git fetch --quiet --depth=1 https://github.com/quokkify/ci-kit.git \
              "refs/tags/$ref"
            git show "FETCH_HEAD:modules/release/template/.github/scripts/enrich_release_notes.py.jinja" \
              > "$template_helper"
            if ! cmp -s "$template_helper" "$helper"; then
              printf 'Refusing template update: %s differs from ci-kit %s. Reconcile this project-owned/customized helper with the template, then rerun.\n' "$helper" "$ref" >&2
              exit 1
            fi
          fi

          # Stage before checking for changes so Copier-created untracked files
          # are included in the no-op decision.
          git add --all
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "chore(template): update shared project template"
          elif [[ "$dropped" != true ]]; then
            printf 'Already up to date with %s; nothing to push.\n' "$ref" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The push runs in a separate job that runs no template code and alone holds the push
          # credential. It receives the new commits as a bundle built on top of $start.
          git bundle create "$RUNNER_TEMP/update.bundle" "$start..$BRANCH"
          printf 'push=true\nref=%s\nbase=%s\n' "$ref" "$start" >> "$GITHUB_OUTPUT"

      - name: Upload the update bundle
        if: steps.update.outputs.push == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copier-template-update
          path: ${{ runner.temp }}/update.bundle
          retention-days: 1
          if-no-files-found: error

  push:
    name: Push the update branch
    needs: update
    if: needs.update.outputs.push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out full repository history
        uses: quokkify/ci-kit/actions/checkout@v4.3.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the update bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: copier-template-update
          path: ${{ runner.temp }}/template-update

      - name: Push the update branch
        env:
          PUSH_TOKEN: ${{ secrets.TEMPLATE_UPDATE_TOKEN || github.token }}
          TEMPLATE_UPDATE_TOKEN_SET: ${{ secrets.TEMPLATE_UPDATE_TOKEN != '' }}
          REF: ${{ needs.update.outputs.ref }}
          BASE: ${{ needs.update.outputs.base }}
          BUNDLE: ${{ runner.temp }}/template-update/update.bundle
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: automation/copier-template-update
        run: |
          set -euo pipefail
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Refusing to push the template update: the update job reported a template ref that is not an exact release tag.\n' >&2
            exit 1
          fi
          header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          printf '::add-mask::%s\n' "$header"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null

          # Only commits built on the commit this job checked out are accepted.
          head="$(git rev-parse HEAD)"
          required=""
          while IFS= read -r line; do
            if [[ -z "$line" ]]; then
              break
            fi
            if [[ "$line" == -* ]]; then
              line="${line#-}"
              required+="${line%% *} "
            fi
          done < "$BUNDLE"
          if [[ "$BASE" != "$head" || "$required" != "$head " ]]; then
            printf 'Refusing to push the template update: the bundle must build on %s, the commit this run checked out (update job started from %s; bundle requires %s).\n' "$head" "$BASE" "${required:-nothing}" >&2
            exit 1
          fi
          git bundle verify --quiet "$BUNDLE"
          git fetch --quiet "$BUNDLE" "+refs/heads/$BRANCH:refs/heads/$BRANCH"

          # GitHub rejects a push by the Actions token that creates or changes a workflow file.
          # Without TEMPLATE_UPDATE_TOKEN, stop here with the way out instead of that rejection.
          if [[ "${TEMPLATE_UPDATE_TOKEN_SET:-false}" != true ]]; then
            workflows="$(git diff --no-renames --name-only "$head" "refs/heads/$BRANCH" -- .github/workflows)"
            if [[ -n "$workflows" ]]; then
              printf 'Refusing to push the template update: CIK-CORE-031 the Actions token cannot push changes to workflow files:\n' >&2
              while IFS= read -r file; do printf '  %s\n' "$file"; done <<<"$workflows" >&2
              printf 'Add a TEMPLATE_UPDATE_TOKEN repository secret (a fine-grained token with Contents and Workflows read and write on this repository) and rerun, or run ci-kit update locally and open the pull request by hand. See https://github.com/quokkify/ci-kit/blob/main/docs/errors/CIK-CORE-031.md\n' >&2
              exit 1
            fi
          fi

          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_1="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $header"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

          remote="$(git ls-remote --heads "$url" "refs/heads/$BRANCH" | cut -f1)"
          if [[ -n "$remote" ]]; then
            git push "--force-with-lease=refs/heads/$BRANCH:$remote" "$url" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          else
            git push "$url" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          fi

          # This workflow deliberately stops at the branch. A pull request opened with
          # GITHUB_TOKEN does not trigger pull_request workflows, so its checks would never
          # run and a required-status-check ruleset would block it forever. Opening it by
          # hand costs one click and keeps every check honest.
          {
            printf '## Template update ready\n\n'
            printf 'Updated to %s and pushed %s.\n\n' "$REF" "$BRANCH"
            printf 'Open the pull request yourself so the checks actually run:\n\n'
            printf '%s/%s/compare/%s...%s?expand=1\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$DEFAULT_BRANCH" "$BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"
