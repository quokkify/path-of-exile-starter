name: Update project template

on:
  workflow_dispatch:
    inputs:
      template-ref:
        description: Optional ci-kit ref; empty uses the latest released tag.
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: copier-template-update
  cancel-in-progress: false

jobs:
  update:
    name: Apply the shared project template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full repository history
        uses: quokkify/ci-kit/actions/checkout@v4.1.0
        with:
          fetch-depth: 0

      - name: Set up Python and Copier
        uses: quokkify/ci-kit/actions/setup-python@v4.1.0
        with:
          python-version: "3.14"
          package-manager: pip
          cache-dependencies: "false"
          install-command: python -m pip install copier==9.19.1

      - name: Apply the template and push the update branch
        env:
          TEMPLATE_REF: ${{ inputs.template-ref }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: automation/copier-template-update
        run: |
          set -euo pipefail
          ref="${TEMPLATE_REF:-}"
          if [[ -z "$ref" ]]; then
            ref="$(gh release view --repo quokkify/ci-kit --json tagName --jq .tagName)"
          fi

          # Manual refs are an explicit trust boundary: only published, stable,
          # exact release tags may select the template used with contents:write.
          if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Refused template ref %s: only exact SemVer release tags are allowed.\n' "$ref" >&2
            exit 1
          fi
          release_json="$(gh release view "$ref" --repo quokkify/ci-kit --json tagName,publishedAt,isDraft,isPrerelease)"
          if ! jq -e --arg expected "$ref" '
            .tagName == $expected and
            (.publishedAt | type == "string" and length > 0) and
            (.isDraft == false) and
            (.isPrerelease == false)
          ' <<<"$release_json" >/dev/null; then
            printf 'Refused template ref %s: it is not an exact published stable release tag.\n' "$ref" >&2
            exit 1
          fi
          echo "Updating to ci-kit $ref"

          git switch -C "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ci-kit v4 has no legacy template. Legacy answers that hand every area off render
          # nothing: their deletion is a commit of its own, and the module update follows on the
          # same branch. Legacy answers that still render files are refused without changes
          # (CIK-CORE-030).
          dropped=false
          if [[ -f .copier-answers.yml ]]; then
            left="$(python - <<'PY'
          from pathlib import Path
          import yaml

          areas = ('validate', 'base', 'security', 'release', 'allure', 'renovate')
          try:
              answers = yaml.safe_load(Path('.copier-answers.yml').read_text())
          except (OSError, UnicodeDecodeError, yaml.YAMLError):
              answers = None
          handed = answers.get('handed_off') if isinstance(answers, dict) else None
          if not isinstance(handed, list) or not all(isinstance(area, str) for area in handed):
              handed = []
          print(', '.join(area for area in areas if area not in handed))
          PY
          )"
            if [[ -n "$left" ]]; then
              printf 'Refusing template update: CIK-CORE-030 legacy answers still render files; migrate with ci-kit v3.11.x (not handed off: %s). See https://github.com/quokkify/ci-kit/blob/main/docs/errors/CIK-CORE-030.md\n' "$left" >&2
              exit 1
            fi
            git rm -q .copier-answers.yml
            git commit -q -m "chore(ci-kit): drop empty legacy answers"
            dropped=true
          fi

          # A partial update is never pushed. Conflicts fail the run the same way the fleet
          # automation fails a repository, so the branch never holds a half-applied template
          # that a reviewer could mistake for a clean one.
          mapfile -t rejected < <(find . -name '*.rej' -not -path './.git/*' -print)
          if (( ${#rejected[@]} )); then
            printf 'Copier produced conflict files:\n' >&2
            printf '  %s\n' "${rejected[@]}" >&2
            exit 1
          fi

          # ci-kit update commits every module it updates; the commits are squashed
          # back into the single update commit below.
          base="$(git rev-parse HEAD)"
          python -m pip install "git+https://github.com/quokkify/ci-kit@${ref}"
          ci-kit update --repo . --to "$ref"
          git reset --soft "$base"

          # Copier deliberately preserves files with local edits, even when the
          # answers already name this ref. Verify the executable release helper
          # against the selected template revision on every run, including a
          # same-ref update. Do not overwrite a consumer customization here.
          helper=".github/scripts/enrich_release_notes.py"
          release=false
          if [[ -f .copier-answers.release.yml ]]; then
            release=true
          fi
          if [[ "$release" == "true" && ! -f "$helper" ]]; then
            printf 'Refusing template update: %s is missing while the release module is installed. Restore the helper, then rerun.\n' "$helper" >&2
            exit 1
          fi
          if [[ -f "$helper" ]]; then
            template_helper="$(mktemp)"
            trap 'rm -f "$template_helper"' EXIT
            git fetch --quiet --depth=1 https://github.com/quokkify/ci-kit.git \
              "refs/tags/$ref"
            git show "FETCH_HEAD:modules/release/template/.github/scripts/enrich_release_notes.py.jinja" \
              > "$template_helper"
            if ! cmp -s "$template_helper" "$helper"; then
              printf 'Refusing template update: %s differs from ci-kit %s. Reconcile this project-owned/customized helper with the template, then rerun.\n' "$helper" "$ref" >&2
              exit 1
            fi
          fi

          # Stage before checking for changes so Copier-created untracked files
          # are included in the no-op decision.
          git add --all
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "chore(template): update shared project template"
          elif [[ "$dropped" != true ]]; then
            printf 'Already up to date with %s; nothing to push.\n' "$ref" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          remote="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
          if [[ -n "$remote" ]]; then
            git push "--force-with-lease=refs/heads/$BRANCH:$remote" origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          # This workflow deliberately stops at the branch. A pull request opened with
          # GITHUB_TOKEN does not trigger pull_request workflows, so its checks would never
          # run and a required-status-check ruleset would block it forever. Opening it by
          # hand costs one click and keeps every check honest.
          {
            printf '## Template update ready\n\n'
            printf 'Updated to %s and pushed %s.\n\n' "$ref" "$BRANCH"
            printf 'Open the pull request yourself so the checks actually run:\n\n'
            printf '%s/%s/compare/%s...%s?expand=1\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$DEFAULT_BRANCH" "$BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"
