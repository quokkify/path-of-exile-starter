name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      GRADLE_OPTS: -Dorg.gradle.console=plain
      COMPOSE_PROJECT_NAME: path-of-exile-starter
      COMPOSE_PROFILES: mock
      NINJA_USE_MOCK_SERVER_AS_PROXY: "true"
      PATH_OF_EXILE_USE_MOCK_SERVER_AS_PROXY: "true"
      MOCK_SERVER_HOST: mock-server
      MOCK_SERVER_PORT: "1080"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java and Gradle
        id: java
        uses: quokkify/ci-kit/actions/setup-java-gradle@v3.1.0
        with:
          java-version: "25"
      - name: Start integration-test services
        uses: quokkify/ci-kit/actions/compose-up@v3.1.0
        with:
          compose-files: |
            tools/docker/docker-compose.yml
            tools/docker/docker-compose.override.yml
          services: mock-server spring-webflux-aggregator spring-telegram-webhook
          profiles: mock
          build: "true"
          additional-compose-args: --quiet-pull
          wait-urls: http://localhost:1080/mockserver/dashboard
          timeout-seconds: "600"
      - name: Run Gradle checks
        uses: quokkify/ci-kit/actions/gradle-retry@v3.1.0
        with:
          command: ${{ steps.java.outputs.gradle-command }} check --no-parallel --no-daemon --console=plain
      - name: Publish JUnit summary
        if: ${{ always() }}
        uses: quokkify/ci-kit/actions/junit-step-summary@v3.1.0
        with:
          junit-paths: "**/build/test-results/**/TEST-*.xml"
          title: Java test results
      - name: Gather Allure results
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p allure-results
          found=0
          while IFS= read -r -d '' directory; do
            found=1
            cp -a "$directory/." allure-results/
          done < <(find . -type d -path "*/build/allure-results" -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "No Gradle Allure results were produced." >&2
            exit 1
          fi
      - name: Upload Allure results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results-java
          path: allure-results
          if-no-files-found: error
          retention-days: 14
      - name: Shut down integration-test services
        if: ${{ always() }}
        run: >-
          docker compose
          -f tools/docker/docker-compose.yml
          -f tools/docker/docker-compose.override.yml
          --profile mock down --volumes --remove-orphans

  validation-complete:
    name: Validation pipeline complete
    needs: [java]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required jobs
        env:
          JAVA_RESULT: ${{ needs.java.result }}
        run: |
          if [[ "$JAVA_RESULT" != "success" ]]; then
            echo "Required test jobs did not succeed: java=$JAVA_RESULT" >&2
            exit 1
          fi
